<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trailered - Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Bienvenido a Trailered</h1>

    <h3>Iniciar Sesión</h3>
    <form id="form=login">
        <div>
            <label for="login-nombre">Nombre de usuario:</label><br>
            <input type="text" id="login-nombre" required>
        </div>
        <br>
        <div>
            <label for="login-password">Contraseña:</label><br>
            <input type="password" id="login-password" required>
        </div>
        <br>
        <button type="submit">Entrar</button>
    </form>

    <hr>

    <h3>Regístrate</h3>
    <form>
        <div>
            <label for="reg-nombre">Nombre de usuario:</label><br>
            <input type="text" id="reg-nombre" required>
        </div>
        <br>
        <div>
            <label for="reg-password">Contraseña:</label><br>
            <input type="password" id="reg-password" required>
        </div>
        <br>
        <button type="submit">Registrarse</button>
    </form>

    <script src="script.js"></script>
</body>
</html>
